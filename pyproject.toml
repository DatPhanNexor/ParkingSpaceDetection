[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkingspace"
version = "1.0.0"
description = "AI-powered parking space detection system using YOLO, OpenCV, and a CustomTkinter desktop dashboard."
authors = [
  { name = "Python Apex", email = "pythonapex01@gmail.com" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "ultralytics>=8.0.0",
  "torch>=1.13.0",
  "torchvision>=0.14.0",
  "PyYAML>=6.0",
  "Pillow>=10.0.0",
  "psutil>=5.9.0",
  "customtkinter>=5.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
parkingspace = "parkingspace.main:legacy_main"
parkingspace-legacy = "parkingspace.main:legacy_main"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["parkingspace*"]
exclude = ["tests*"]

[tool.pyright]
extraPaths = ["ParkingSpaceDesktopApp", "ParkingVisionV8", "tests"]
