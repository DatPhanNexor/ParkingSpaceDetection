# Standalone mode: every database client uses the Docker MySQL service.
services:
  database-migrate:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  auth-service:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      BOOTSTRAP_ADMIN_ENABLED: "true"

  parking-billing-service:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

  ai-detection-service:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

  reporting-service:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

  streamlit-admin:
    environment:
      AI_PARKING_DB_HOST: mysql
      AI_PARKING_DB_PORT: "3306"
      AI_PARKING_DB_USER: ${MYSQL_USER}
      AI_PARKING_DB_PASSWORD: ${MYSQL_PASSWORD}
      AI_PARKING_DB_NAME: ${MYSQL_DATABASE}
