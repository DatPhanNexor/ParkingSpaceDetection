# Smart Parking TTTN - Docker Compose
# Dat file nay tai: D:\Project\ParkingSpaceDetection\infrastructure\compose.yaml
# Dat file .env cung thu muc voi compose.yaml.
# Docker Desktop se gom cac container duoi project "parking-tttn-dev".
# Khong dat container_name de giu dung co che nhom, DNS va lifecycle cua Compose.

name: parking-tttn-dev

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: /app/backend_microservices:/app
  TZ: ${TZ:-Asia/Ho_Chi_Minh}

  DB_HOST: ${AI_PARKING_DB_HOST:-host.docker.internal}
  DB_PORT: ${AI_PARKING_DB_PORT:-3306}
  DB_USER: ${AI_PARKING_DB_USER:-root}
  DB_PASSWORD: ${AI_PARKING_DB_PASSWORD:-}
  DB_NAME: ${AI_PARKING_DB_NAME:-ai_parking_system}

  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}@redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in infrastructure/.env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infrastructure/.env}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}

  # Thu muc ghi cache/runtime cua Ultralytics, Matplotlib va Torch.
  HOME: /home/appuser
  MPLCONFIGDIR: /tmp/matplotlib
  YOLO_CONFIG_DIR: /tmp/ultralytics
  ULTRALYTICS_CONFIG_DIR: /tmp/ultralytics
  TORCH_HOME: /tmp/torch

x-backend-build: &backend-build
  context: ../backend_microservices
  dockerfile: Dockerfile.core
  args:
    PIP_FIND_LINKS: ${PIP_FIND_LINKS:-}
    PIP_NO_INDEX: ${PIP_NO_INDEX:-false}
    PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  extra_hosts:
    - host.docker.internal:host-gateway

x-ai-build: &ai-build
  context: ../backend_microservices
  dockerfile: Dockerfile.ai
  args:
    PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
    TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.20.1}
    AIO_PIKA_VERSION: ${AIO_PIKA_VERSION:-9.5.6}
    REDIS_PY_VERSION: ${REDIS_PY_VERSION:-5.2.1}
    PYJWT_VERSION: ${PYJWT_VERSION:-2.10.1}

x-backend-common: &backend-common
  image: parking-tttn-dev-backend-core:${APP_IMAGE_TAG:-local}
  build: *backend-build
  restart: unless-stopped
  init: true
  working_dir: /app/backend_microservices
  environment: *backend-environment
  networks:
    - parking-net
  extra_hosts:
    - host.docker.internal:host-gateway
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  logging: *default-logging

services:
  mysql:
    profiles:
      - standalone-db
    image: mysql:${MYSQL_IMAGE_TAG:-8.4.11}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infrastructure/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_parking_system}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in infrastructure/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infrastructure/.env}
    ports:
      # Dung 3307 de tranh MySQL/Laragon thuong dung 3306.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ../database/ai_parking_system.sql
        target: /docker-entrypoint-initdb.d/01_ai_parking_system.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../backend_microservices/migrations/001_initial_schema.sql
        target: /docker-entrypoint-initdb.d/02_microservices_schema.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - parking-net
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging

  database-migrate:
    image: mysql:${MYSQL_IMAGE_TAG:-8.4.11}
    restart: "no"
    environment:
      DB_HOST: ${AI_PARKING_DB_HOST:-host.docker.internal}
      DB_PORT: ${AI_PARKING_DB_PORT:-3306}
      DB_USER: ${AI_PARKING_DB_USER:-root}
      DB_PASSWORD: ${AI_PARKING_DB_PASSWORD:-}
      DB_NAME: ${AI_PARKING_DB_NAME:-ai_parking_system}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        for attempt in $$(seq 1 45); do
          if MYSQL_PWD="$${DB_PASSWORD}" mysql \
            --host="$${DB_HOST}" \
            --port="$${DB_PORT}" \
            --user="$${DB_USER}" \
            --database="$${DB_NAME}" \
            --connect-timeout=3 \
            --execute="SELECT 1" >/dev/null 2>&1; then
            break
          fi
          if [ "$${attempt}" -eq 45 ]; then
            echo "Canonical MySQL is not reachable" >&2
            exit 1
          fi
          sleep 2
        done
        MYSQL_PWD="$${DB_PASSWORD}" mysql \
          --host="$${DB_HOST}" \
          --port="$${DB_PORT}" \
          --user="$${DB_USER}" \
          --database="$${DB_NAME}" \
          < /migrations/001_initial_schema.sql
        echo "Canonical schema migration completed"
    volumes:
      - type: bind
        source: ../backend_microservices/migrations/001_initial_schema.sql
        target: /migrations/001_initial_schema.sql
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - parking-net
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_IMAGE_TAG:-5.2.3-apache}
    restart: unless-stopped
    environment:
      PMA_HOST: ${AI_PARKING_DB_HOST:-host.docker.internal}
      PMA_PORT: ${AI_PARKING_DB_PORT:-3306}
      PMA_USER: ${AI_PARKING_DB_USER:-root}
      PMA_PASSWORD: ${AI_PARKING_DB_PASSWORD:-}
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 256M
      MEMORY_LIMIT: 512M
    ports:
      # Dung 8081 de tranh Jenkins thuong dung 8080.
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - parking-net
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.4.11-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --save 60 1000 \
          --maxmemory-policy noeviction \
          --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - parking-net
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:${RABBITMQ_IMAGE_TAG:-4.3.5-management}
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in infrastructure/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infrastructure/.env}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in infrastructure/.env}
    ports:
      # Dung 5673/15673 de tranh RabbitMQ khac tai 5672/15672.
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - parking-net
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging

  auth-service:
    <<: *backend-common
    environment:
      <<: *backend-environment
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
    command:
      - /bin/sh
      - -ec
      - |
        python scripts/bootstrap_runtime.py
        exec uvicorn services.auth_service.main:app \
          --host 0.0.0.0 \
          --port 8001 \
          --workers 1 \
          --timeout-keep-alive 10
    ports:
      - "${AUTH_PORT:-8001}:8001"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  parking-billing-service:
    <<: *backend-common
    command:
      - uvicorn
      - services.parking_billing_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - --workers
      - "1"
      - --timeout-keep-alive
      - "10"
    ports:
      - "${PARKING_BILLING_PORT:-8003}:8003"
    volumes:
      - type: bind
        source: ../ParkingSpaceDesktopApp/billing_manager.py
        target: /app/ParkingSpaceDesktopApp/billing_manager.py
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      auth-service:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ai-detection-service:
    <<: *backend-common
    image: parking-tttn-dev-backend:${APP_IMAGE_TAG:-local}
    build: *ai-build
    environment:
      <<: *backend-environment
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
    command:
      - uvicorn
      - services.ai_detection_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --workers
      - "1"
      - --timeout-keep-alive
      - "30"
    ports:
      - "${AI_DETECTION_PORT:-8002}:8002"
    volumes:
      # Model goc ma LegacyAIAdapter dang su dung.
      - type: bind
        source: ../yolov8s.pt
        target: /app/yolov8s.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../yolo11n-seg.pt
        target: /app/yolo11n-seg.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../yolo11x-seg.pt
        target: /app/yolo11x-seg.pt
        read_only: true
        bind:
          create_host_path: false

      # Runtime asset cho Board Lock 9 vi tri S01-S09.
      - type: bind
        source: ../ParkingVisionV8/run_droidcam_v8s_boardlock.py
        target: /app/ParkingVisionV8/run_droidcam_v8s_boardlock.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/parkingvision_board_lock_9zones.json
        target: /app/ParkingVisionV8/parkingvision_board_lock_9zones.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/parkingvision_slots_template_9zones.json
        target: /app/ParkingVisionV8/parkingvision_slots_template_9zones.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/empty_baseline_9zones.jpg
        target: /app/ParkingVisionV8/empty_baseline_9zones.jpg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/reference_9zones_board.jpg
        target: /app/ParkingVisionV8/reference_9zones_board.jpg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/models/parking_v8s_best.pt
        target: /app/ParkingVisionV8/models/parking_v8s_best.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/models/parking_v8s_e15_best.pt
        target: /app/ParkingVisionV8/models/parking_v8s_e15_best.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingVisionV8/models/yolov8s.pt
        target: /app/ParkingVisionV8/models/yolov8s.pt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      parking-billing-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()
      interval: 15s
      timeout: 8s
      retries: 40
      # Lan dau nap Torch/YOLO tren CPU co the mat vai phut.
      start_period: 300s

  reporting-service:
    <<: *backend-common
    command:
      - uvicorn
      - services.reporting_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8004"
      - --workers
      - "1"
      - --timeout-keep-alive
      - "30"
    ports:
      - "${REPORTING_PORT:-8004}:8004"
    depends_on:
      auth-service:
        condition: service_healthy
      parking-billing-service:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  streamlit-admin:
    image: parking-tttn-dev-streamlit-admin:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend_microservices/streamlit_admin
      dockerfile: Dockerfile
      args:
        PIP_FIND_LINKS: ${PIP_FIND_LINKS:-}
        PIP_NO_INDEX: ${PIP_NO_INDEX:-false}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      extra_hosts:
        - host.docker.internal:host-gateway
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      AUTH_API_URL: http://auth-service:8001/api/v1
      AI_PARKING_DB_HOST: ${AI_PARKING_DB_HOST:-host.docker.internal}
      AI_PARKING_DB_PORT: ${AI_PARKING_DB_PORT:-3306}
      AI_PARKING_DB_USER: ${AI_PARKING_DB_USER:-root}
      AI_PARKING_DB_PASSWORD: ${AI_PARKING_DB_PASSWORD:-}
      AI_PARKING_DB_NAME: ${AI_PARKING_DB_NAME:-ai_parking_system}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    command:
      - streamlit
      - run
      - /app/ParkingSpaceDesktopApp/streamlit_dashboard.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - type: bind
        source: ../ParkingSpaceDesktopApp/streamlit_dashboard.py
        target: /app/ParkingSpaceDesktopApp/streamlit_dashboard.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../ParkingSpaceDesktopApp/database_manager.py
        target: /app/ParkingSpaceDesktopApp/canonical_database_manager.py
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      auth-service:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
      reporting-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - parking-net
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

networks:
  parking-net:
    driver: bridge
    labels:
      com.parking.project: parking-tttn-dev

volumes:
  mysql_data:
    labels:
      com.parking.project: parking-tttn-dev
  redis_data:
    labels:
      com.parking.project: parking-tttn-dev
  rabbitmq_data:
    labels:
      com.parking.project: parking-tttn-dev
