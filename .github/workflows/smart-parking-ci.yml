name: Smart Parking CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_backend_image:
        description: Build the heavy backend image with Torch and Ultralytics
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: smart-parking-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  FLUTTER_VERSION: "3.38.5"

jobs:
  backend-test:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-only-smart-parking-secret-not-for-production
      PYTHONPATH: ${{ github.workspace }}/backend_microservices:${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend_microservices/pyproject.toml
            backend_microservices/requirements.txt

      - name: Verify backend source layout
        run: |
          set -euo pipefail

          required_files=(
            "backend_microservices/shared/security/jwt_rbac.py"
            "backend_microservices/shared/events/schemas.py"
            "backend_microservices/adapters/legacy_billing_adapter/adapter.py"
            "backend_microservices/adapters/slot_id_mapper/mapper.py"
            "backend_microservices/tests/unit/test_auth.py"
            "backend_microservices/tests/unit/test_idempotency.py"
            "backend_microservices/tests/unit/test_pricing.py"
            "backend_microservices/tests/unit/test_slot_mapper.py"
            "ParkingSpaceDesktopApp/billing_manager.py"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error file=$file::Required backend file is missing"
              exit 1
            }
          done

      - name: Install focused unit-test dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip wheel
          python -m pip install \
            "fastapi>=0.109,<1" \
            "pydantic>=2.6,<3" \
            "passlib>=1.7.4,<2" \
            "PyJWT>=2.8,<3" \
            "aio-pika>=9.4,<10" \
            "pytest>=8,<9" \
            "pytest-asyncio>=0.23,<2"

          python -m pip check

      - name: Compile backend Python sources
        run: |
          set -euo pipefail
          python -m compileall -q backend_microservices

      - name: Verify current event fixture
        run: |
          set -euo pipefail

          fixture="backend_microservices/tests/unit/test_idempotency.py"
          required_fields=(
            measurement_valid
            board_lock_valid
            camera_ok
            status_reason
            stable_frame_count
            observed_at_utc
            source_elapsed_seconds
          )

          for field in "${required_fields[@]}"; do
            grep -q "$field" "$fixture" || {
              echo "::error file=$fixture::The event fixture is stale and is missing field '$field'"
              exit 1
            }
          done

      - name: Run backend unit tests
        run: |
          set -euo pipefail

          python -m pytest \
            --quiet \
            --maxfail=1 \
            backend_microservices/tests/unit

      - name: Write backend summary
        if: always()
        run: |
          {
            echo "## Backend CI"
            echo "- Python: ${PYTHON_VERSION}"
            echo "- Syntax compilation: completed"
            echo "- Unit test suite: executed"
            echo "- Current event fixture: validated"
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-test:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Verify Flutter project and toolchain
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f pubspec.lock
          test -f lib/main.dart
          test -f lib/models/slot_model.dart
          test -f lib/widgets/slot_grid.dart
          test -f test/widget_test.dart

          grep -Fq "import '../models/slot_model.dart';" lib/widgets/slot_grid.dart || {
            echo "::error file=flutter_mobile_app/lib/widgets/slot_grid.dart::Missing Slot model import required by SlotGrid"
            exit 1
          }

          flutter --version
          dart --version
          flutter config --no-analytics

      - name: Resolve Flutter dependencies
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail
          flutter pub get

      - name: Analyze Flutter source
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail

          # Existing style/lint debt remains visible in the log, but only
          # syntax and type errors block this WIP branch.
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter widget tests
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded

      - name: Write Flutter summary
        if: always()
        run: |
          {
            echo "## Flutter CI"
            echo "- Flutter: ${FLUTTER_VERSION}"
            echo "- Dependency resolution: executed"
            echo "- Analyzer: syntax/type errors are fatal"
            echo "- Widget tests: executed"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Compose validation and image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: parking-tttn-ci
      COMPOSE_FILE_PATH: infrastructure/compose.yaml
      CI_ENV_FILE: infrastructure/.env.ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Docker toolchain
        run: |
          set -euo pipefail

          docker version
          docker compose version

          compose_version="$(docker compose version --short | sed 's/^v//')"
          python - "$compose_version" <<'PY'
          import re
          import sys

          raw = sys.argv[1]
          match = re.match(r"^(\d+)\.(\d+)\.(\d+)", raw)
          if not match:
              raise SystemExit(f"Cannot parse Docker Compose version: {raw}")

          version = tuple(map(int, match.groups()))
          minimum = (2, 17, 0)
          if version < minimum:
              raise SystemExit(
                  f"Docker Compose {raw} is too old; >= 2.17.0 is required "
                  "for dockerfile_inline."
              )

          print(f"Docker Compose {raw} satisfies the minimum version.")
          PY

      - name: Create isolated CI environment file
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"

          cat > "$CI_ENV_FILE" <<EOF
          TZ=UTC
          APP_IMAGE_TAG=ci-${short_sha}

          MYSQL_ROOT_PASSWORD=ci-admin
          MYSQL_DATABASE=ai_parking_system
          MYSQL_USER=admin
          MYSQL_PASSWORD=admin

          REDIS_PASSWORD=admin

          RABBITMQ_USER=admin
          RABBITMQ_PASSWORD=admin

          JWT_SECRET=ci-only-smart-parking-secret-not-for-production
          BOOTSTRAP_ADMIN_USERNAME=admin
          BOOTSTRAP_ADMIN_PASSWORD=admin
          BOOTSTRAP_ADMIN_FULL_NAME=CI Administrator

          PYTORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          EOF

          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "CI_STREAMLIT_IMAGE=parking-tttn-dev-streamlit-admin:ci-${short_sha}" >> "$GITHUB_ENV"
          echo "CI_BACKEND_IMAGE=parking-tttn-dev-backend:ci-${short_sha}" >> "$GITHUB_ENV"

      - name: Verify Docker and Compose source files
        run: |
          set -euo pipefail

          required_files=(
            "$COMPOSE_FILE_PATH"
            "database/ai_parking_system.sql"
            "backend_microservices/migrations/001_initial_schema.sql"
            "backend_microservices/requirements.txt"
            "backend_microservices/streamlit_admin/Dockerfile"
            "backend_microservices/streamlit_admin/app.py"
            "backend_microservices/streamlit_admin/requirements.txt"
            "ParkingSpaceDesktopApp/billing_manager.py"
            "ParkingVisionV8/run_droidcam_v8s_boardlock.py"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error file=$file::Required Docker/Compose source file is missing"
              exit 1
            }
          done

      - name: Validate Docker Compose model
        run: |
          set -euo pipefail

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          "${compose[@]}" config --quiet

          expected_file="$RUNNER_TEMP/expected-services.txt"
          actual_file="$RUNNER_TEMP/actual-services.txt"

          printf '%s\n' \
            ai-detection-service \
            auth-service \
            mysql \
            parking-billing-service \
            phpmyadmin \
            rabbitmq \
            redis \
            reporting-service \
            streamlit-admin \
            | sort > "$expected_file"

          "${compose[@]}" config --services | sort > "$actual_file"

          diff --unified "$expected_file" "$actual_file"
          echo "Validated all 9 expected Compose services."

      - name: Build Streamlit image through Docker Compose
        run: |
          set -euo pipefail

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          "${compose[@]}" build --pull streamlit-admin
          docker image inspect "$CI_STREAMLIT_IMAGE" > /dev/null

      - name: Smoke-test the built Streamlit image
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint python \
            "$CI_STREAMLIT_IMAGE" \
            -c "import requests, streamlit; print('Streamlit image imports passed')"

      - name: Build full backend image when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backend_image }}
        run: |
          set -euo pipefail

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          # The backend image contains Torch, Ultralytics and OpenCV, so it is
          # intentionally opt-in for manual CI runs to avoid exhausting normal
          # push/PR runner time and disk space.
          "${compose[@]}" build --pull auth-service
          docker image inspect "$CI_BACKEND_IMAGE" > /dev/null

      - name: Write Docker summary
        if: always()
        run: |
          {
            echo "## Docker CI"
            echo "- Compose project: ${COMPOSE_PROJECT_NAME}"
            echo "- Expected services: 9"
            echo "- Compose validation: executed"
            echo "- Streamlit image build and import smoke test: executed"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_backend_image }}" == "true" ]]; then
              echo "- Full backend image: requested"
            else
              echo "- Full backend image: skipped (manual opt-in)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
