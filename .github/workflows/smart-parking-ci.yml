name: Smart Parking CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      full_backend_image:
        description: Build the heavy backend image with Torch and Ultralytics
        required: false
        default: false
        type: boolean


permissions:
  contents: read


concurrency:
  group: smart-parking-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


defaults:
  run:
    shell: bash


env:
  PYTHON_VERSION: "3.11"
  FLUTTER_VERSION: "3.38.5"


jobs:

  # ============================================================
  # BACKEND
  # ============================================================

  backend-test:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_SECRET: ci-only-smart-parking-secret-not-for-production
      PYTHONPATH: ${{ github.workspace }}/backend_microservices:${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend_microservices/pyproject.toml
            backend_microservices/requirements.txt


      - name: Verify backend source layout
        run: |
          set -euo pipefail

          required_files=(
            "backend_microservices/shared/security/jwt_rbac.py"
            "backend_microservices/shared/events/schemas.py"
            "backend_microservices/adapters/legacy_billing_adapter/adapter.py"
            "backend_microservices/adapters/slot_id_mapper/mapper.py"
            "backend_microservices/tests/unit/test_auth.py"
            "backend_microservices/tests/unit/test_idempotency.py"
            "backend_microservices/tests/unit/test_pricing.py"
            "backend_microservices/tests/unit/test_slot_mapper.py"
            "ParkingSpaceDesktopApp/billing_manager.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required backend file is missing"
              exit 1
            fi
          done

          echo "Backend source layout verified."


      - name: Install focused unit-test dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip wheel

          python -m pip install \
            "fastapi>=0.109,<1" \
            "pydantic>=2.6,<3" \
            "passlib>=1.7.4,<2" \
            "PyJWT>=2.8,<3" \
            "aio-pika>=9.4,<10" \
            "pytest>=8,<9" \
            "pytest-asyncio>=0.23,<2"

          python -m pip check


      - name: Compile backend Python sources
        run: |
          set -euo pipefail
          python -m compileall -q backend_microservices


      - name: Verify current event fixture
        run: |
          set -euo pipefail

          fixture="backend_microservices/tests/unit/test_idempotency.py"

          required_fields=(
            measurement_valid
            board_lock_valid
            camera_ok
            status_reason
            stable_frame_count
            observed_at_utc
            source_elapsed_seconds
          )

          for field in "${required_fields[@]}"; do
            if ! grep -q "$field" "$fixture"; then
              echo "::error file=$fixture::The event fixture is stale and is missing field '$field'"
              exit 1
            fi
          done

          echo "Current event fixture verified."


      - name: Run backend unit tests
        id: backend_tests
        run: |
          set -euo pipefail

          python -m pytest \
            --quiet \
            --maxfail=1 \
            backend_microservices/tests/unit


      - name: Write backend summary
        if: always()
        run: |
          {
            echo "## Backend CI"
            echo
            echo "- Python: ${PYTHON_VERSION}"
            echo "- Syntax compilation: completed"
            echo "- Current event fixture: validated"
            echo "- Unit tests: ${{ steps.backend_tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # FLUTTER
  # ============================================================

  flutter-test:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true


      - name: Verify Flutter project and toolchain
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail

          required_files=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib/main.dart"
            "lib/models/slot_model.dart"
            "lib/widgets/slot_grid.dart"
            "test/widget_test.dart"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=flutter_mobile_app/$file::Required Flutter file is missing"
              exit 1
            fi
          done

          grep -Fq "import '../models/slot_model.dart';" \
            lib/widgets/slot_grid.dart || {
              echo "::error file=flutter_mobile_app/lib/widgets/slot_grid.dart::Missing Slot model import required by SlotGrid"
              exit 1
            }

          flutter --version
          dart --version
          flutter config --no-analytics


      - name: Resolve Flutter dependencies
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail
          flutter pub get


      - name: Analyze Flutter source
        id: flutter_analyze
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      - name: Run Flutter widget tests
        id: flutter_tests
        working-directory: flutter_mobile_app
        run: |
          set -euo pipefail

          flutter test \
            --no-pub \
            --reporter expanded


      - name: Write Flutter summary
        if: always()
        run: |
          {
            echo "## Flutter CI"
            echo
            echo "- Flutter: ${FLUTTER_VERSION}"
            echo "- Dependency resolution: executed"
            echo "- Analyzer: ${{ steps.flutter_analyze.outcome }}"
            echo "- Widget tests: ${{ steps.flutter_tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # DOCKER COMPOSE
  # ============================================================

  docker-build:
    name: Docker Compose validation and image build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      COMPOSE_PROJECT_NAME: parking-tttn-ci
      COMPOSE_FILE_PATH: infrastructure/compose.yaml

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false


      # --------------------------------------------------------
      # Docker / Compose toolchain
      # --------------------------------------------------------

      - name: Verify Docker toolchain
        run: |
          set -euo pipefail

          docker version
          docker compose version

          compose_version="$(docker compose version --short | sed 's/^v//')"

          python - "$compose_version" <<'PY'
          import re
          import sys

          raw = sys.argv[1]

          match = re.match(r"^(\d+)\.(\d+)\.(\d+)", raw)

          if not match:
              raise SystemExit(
                  f"Cannot parse Docker Compose version: {raw}"
              )

          version = tuple(map(int, match.groups()))
          minimum = (2, 17, 0)

          if version < minimum:
              raise SystemExit(
                  f"Docker Compose {raw} is too old; "
                  ">= 2.17.0 is required."
              )

          print(
              f"Docker Compose {raw} satisfies "
              "the minimum version."
          )
          PY


      # --------------------------------------------------------
      # Source verification
      # --------------------------------------------------------

      - name: Verify Docker and Compose source files
        id: docker_sources
        run: |
          set -euo pipefail

          if [[ ! -f "$COMPOSE_FILE_PATH" ]]; then
            echo "::error file=$COMPOSE_FILE_PATH::Docker Compose file is missing"
            exit 1
          fi

          echo "Compose source:"
          echo "  $COMPOSE_FILE_PATH"

          echo
          echo "Docker-related files:"
          echo

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name 'Dockerfile' \
              -o -name 'Dockerfile.*' \
              -o -name 'compose.yaml' \
              -o -name 'compose.yml' \
              -o -name 'docker-compose.yaml' \
              -o -name 'docker-compose.yml' \
            \) \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path '*/build/*' \
            -not -path '*/.dart_tool/*' \
            -print \
            | sort

          echo
          echo "Docker/Compose source verification passed."


      # --------------------------------------------------------
      # Create isolated CI environment.
      #
      # These values are CI-only and intentionally do not use
      # production credentials.
      # --------------------------------------------------------

      - name: Create isolated CI environment file
        id: ci_environment
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          ci_env_file="$RUNNER_TEMP/smart-parking-ci.env"

          cat > "$ci_env_file" <<EOF
          TZ=UTC
          APP_ENV=ci
          APP_IMAGE_TAG=ci-${short_sha}

          MYSQL_ROOT_PASSWORD=ci-admin
          MYSQL_DATABASE=ai_parking_system
          MYSQL_USER=admin
          MYSQL_PASSWORD=admin

          REDIS_PASSWORD=admin

          RABBITMQ_USER=admin
          RABBITMQ_PASSWORD=admin
          RABBITMQ_ERLANG_COOKIE=ci-only-rabbitmq-erlang-cookie-not-for-production

          JWT_SECRET=ci-only-smart-parking-secret-not-for-production

          BOOTSTRAP_ADMIN_USERNAME=admin
          BOOTSTRAP_ADMIN_PASSWORD=admin
          BOOTSTRAP_ADMIN_FULL_NAME=CI Administrator

          PYTORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          EOF

          chmod 600 "$ci_env_file"

          echo "CI_ENV_FILE=$ci_env_file" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

          echo "CI environment file created:"
          echo "  $ci_env_file"


      # --------------------------------------------------------
      # Check variables that Compose marks as mandatory.
      #
      # This gives a clear CI error instead of an obscure Docker
      # interpolation failure.
      # --------------------------------------------------------

      - name: Verify required Compose environment variables
        run: |
          set -euo pipefail

          python - "$COMPOSE_FILE_PATH" "$CI_ENV_FILE" <<'PY'
          import pathlib
          import re
          import sys

          compose_path = pathlib.Path(sys.argv[1])
          env_path = pathlib.Path(sys.argv[2])

          compose_text = compose_path.read_text(
              encoding="utf-8"
          )

          env_keys = set()

          for raw_line in env_path.read_text(
              encoding="utf-8"
          ).splitlines():

              line = raw_line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              if "=" not in line:
                  continue

              key = line.split("=", 1)[0].strip()

              if key:
                  env_keys.add(key)

          patterns = (
              r"\$\{([A-Za-z_][A-Za-z0-9_]*)"
              r":\?[^}]*\}",

              r"\$\{([A-Za-z_][A-Za-z0-9_]*)"
              r"\?[^}]*\}",
          )

          required = set()

          for pattern in patterns:
              required.update(
                  re.findall(pattern, compose_text)
              )

          missing = sorted(
              required.difference(env_keys)
          )

          if missing:
              print(
                  "::error::CI environment is missing "
                  "required Docker Compose variables: "
                  + ", ".join(missing)
              )

              raise SystemExit(1)

          if required:
              print(
                  "Required Compose variables satisfied: "
                  + ", ".join(sorted(required))
              )
          else:
              print(
                  "Compose file declares no additional "
                  "mandatory interpolation variables."
              )
          PY


      # --------------------------------------------------------
      # Validate Compose.
      # --------------------------------------------------------

      - name: Validate Docker Compose model
        id: compose_validation
        run: |
          set -euo pipefail

          test -f "$COMPOSE_FILE_PATH"
          test -f "$CI_ENV_FILE"

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          echo "Validating Docker Compose model..."

          "${compose[@]}" config --quiet

          echo
          echo "Resolved Compose services:"
          echo

          actual_services="$("${compose[@]}" config --services)"

          printf '%s\n' "$actual_services"

          required_services=(
            "ai-detection-service"
            "auth-service"
            "database-migrate"
            "parking-billing-service"
            "phpmyadmin"
            "rabbitmq"
            "redis"
            "reporting-service"
            "streamlit-admin"
          )

          missing_services=()

          for service in "${required_services[@]}"; do
            if ! grep -Fxq "$service" <<< "$actual_services"; then
              missing_services+=("$service")
            fi
          done

          if (( ${#missing_services[@]} > 0 )); then
            echo
            echo "::error::Docker Compose is missing required Smart Parking services."
            echo "Missing services:"

            printf '  - %s\n' "${missing_services[@]}"

            exit 1
          fi

          echo
          echo "Validated all ${#required_services[@]} required Compose services."


      # --------------------------------------------------------
      # Build only the lightweight Streamlit image during normal
      # push/PR CI.
      # --------------------------------------------------------

      - name: Build Streamlit image through Docker Compose
        id: streamlit_build
        run: |
          set -euo pipefail

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          if ! "${compose[@]}" \
            config --services \
            | grep -Fxq "streamlit-admin"; then

            echo "::error::Compose service 'streamlit-admin' does not exist"
            exit 1
          fi

          echo "Building streamlit-admin image..."

          "${compose[@]}" \
            build \
            --pull \
            streamlit-admin

          echo "Streamlit image build completed."


      # --------------------------------------------------------
      # Smoke test.
      #
      # Uses the Compose service itself, avoiding assumptions
      # about generated Docker image names/tags.
      # --------------------------------------------------------

      - name: Smoke-test the built Streamlit image
        id: streamlit_smoke_test
        run: |
          set -euo pipefail

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          "${compose[@]}" \
            run \
            --rm \
            --no-deps \
            -T \
            --entrypoint python \
            streamlit-admin \
            -c "import requests, streamlit; print('Streamlit image imports passed')"


      # --------------------------------------------------------
      # Heavy backend image.
      #
      # Torch / Ultralytics / OpenCV make this intentionally
      # manual-only.
      # --------------------------------------------------------

      - name: Build full backend image when explicitly requested
        id: full_backend_build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backend_image }}
        run: |
          set -euo pipefail

          compose=(
            docker compose
            --env-file "$CI_ENV_FILE"
            -p "$COMPOSE_PROJECT_NAME"
            -f "$COMPOSE_FILE_PATH"
          )

          if ! "${compose[@]}" \
            config --services \
            | grep -Fxq "auth-service"; then

            echo "::error::Compose service 'auth-service' does not exist"
            exit 1
          fi

          echo "Building full backend image..."

          "${compose[@]}" \
            build \
            --pull \
            auth-service

          echo "Full backend image build completed."


      # --------------------------------------------------------
      # Cleanup.
      # --------------------------------------------------------

      - name: Clean up Docker Compose resources
        if: always()
        run: |
          set +e

          if [[ \
            -n "${COMPOSE_FILE_PATH:-}" \
            && -f "${COMPOSE_FILE_PATH:-}" \
            && -n "${CI_ENV_FILE:-}" \
            && -f "${CI_ENV_FILE:-}" \
          ]]; then

            docker compose \
              --env-file "$CI_ENV_FILE" \
              -p "$COMPOSE_PROJECT_NAME" \
              -f "$COMPOSE_FILE_PATH" \
              down \
              --volumes \
              --remove-orphans
          fi

          exit 0


      # --------------------------------------------------------
      # Job summary.
      # --------------------------------------------------------

      - name: Write Docker summary
        if: always()
        run: |
          {
            echo "## Docker CI"
            echo
            echo "- Compose project: ${COMPOSE_PROJECT_NAME}"
            echo "- Compose source: ${COMPOSE_FILE_PATH}"
            echo "- Required Smart Parking services: 9"
            echo "- Compose validation: ${{ steps.compose_validation.outcome }}"
            echo "- Streamlit image build: ${{ steps.streamlit_build.outcome }}"
            echo "- Streamlit smoke test: ${{ steps.streamlit_smoke_test.outcome }}"

            if [[ \
              "${{ github.event_name }}" == "workflow_dispatch" \
              && "${{ inputs.full_backend_image }}" == "true" \
            ]]; then

              echo "- Full backend image: ${{ steps.full_backend_build.outcome }}"

            else

              echo "- Full backend image: skipped (manual opt-in)"
            fi

          } >> "$GITHUB_STEP_SUMMARY"