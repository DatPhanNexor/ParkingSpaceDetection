[project]
name = "smart-parking-microservices"
version = "0.1.0"
description = "Microservices for Smart Parking System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "mysql-connector-python>=8.0.0",
    "aiomysql>=0.2.0",
    "redis>=5.0.0",
    "pika>=1.3.2",
    "aio-pika>=9.4.0",
    "PyJWT>=2.8.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",
    "torch>=1.13.0",
    "torchvision>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
